<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Milk Clicker</title>
        <script defer src="main.js"></script>
        <link rel="stylesheet" type="text/css" href="Styles/style.css">
        <lin rel="icon" type="image/x-icon" href="Resources/milk.svg">
    </head>
    <body>
        <div class="site-wrapper">
        <!--Navbar-->
        <div id="header" class="navbar">
            <div class="left-content" id="header-left">
                <button class="invisibleButton" onClick="switchAchiev()"><div class="small-button achiev-button"><img src="Resources/star.png" class="icon"></div></button>
                <button class="invisibleButton" onClick="switchStats()"><div class="small-button stats-button"><img src="Resources/line-chart.png" class="icon"></div></button>
                <button class="invisibleButton" onClick="switchSettings()"><div class="small-button settings-button"><img src="Resources/gear.png" class="icon"></div></button>
            </div>
            <div class="right-content" id="header-right">
                <button class="invisibleButton" onClick="switchMilk()"><div class="small-button milk-button" onClick = "switchSettings()"><img src="Resources/milk.png" class="icon"></div></button>
            </div>
        </div>

        <!--Alert stack-->
        <div id="alertStack" class="alert-stack"></div>

        <!--Scenes-->
        <div id="milkScene" class="scene">
            <div id="milkBanner">
                <p style="padding: 10px; font-size: 20px; text-align: center"><span id = "milkTotal"></span></p>
            </div>
            <button style="padding: 10px; background-color: #5dbeff;" onclick="incMilk()"><img src="Resources/cow.png" width="100px" style="display: block; margin: auto;">Get Milk</button>
            <div id="purchaseButtons" class="flex-container"></div>
        </div>
        <div id="statsScene" class="scene">
            <div id="statsBanner">
                <p style="padding: 10px; font-size: 20px; text-align: center">Statistics</p>
            </div>
            <div id="statsContent">
                <p style="text-align: center"><span id = "totalClicks"></span></p>
                <p style="text-align: center"><span id = "totalMilk"></span></p>
                <p style="text-align: center"><span id = "totalBuildings"></span></p>
            </div>
        </div>
        <div id="achievScene" class="scene">
            <div id="achievBanner">
                <p style="padding: 10px; font-size: 20px; text-align: center">Achievements</p>
            </div>
            <div id="achievContent" class="flex-container"></div>
        </div>
        <div id="settingsScene" class="scene">
            <div id="settingsBanner">
                <p style="padding: 10px; font-size: 20px; text-align: center">Settings</p>
            </div>
            <div id="settingsContent">
                <div class="flex-container">
                    <div class="setting">
                        <button class="settingButton" onclick="exportGame()">Export Game</button>
                    </div>
                    <div class="setting">
                        <button class="settingButton" onclick="importGame()">Import Game</button>
                    </div>
                    <div class="setting">
                        <button class="settingButton" onclick="debug()">Debug Mode</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="cheeseScene" class="scene">
            <div id="cheeseBanner">
                <p style="padding: 10px; font-size: 20px; text-align: center">Cheese</p>
            </div>
            <div id="cheeseContent" class="flex-container">
                <p>Cheese has not yet been implemented...</p>
            </div>
        </div>

        <!--Footer Content-->
        <footer>
            <p>© 2025-26 c00lkid9999&emsp;</p>
            <a href="https://github.com/c00lkid9999/"><img src="Resources/github.svg" width="20px"></a>
        </footer>
        </div>
    </body>
</html>
